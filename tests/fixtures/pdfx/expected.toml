[x4-xmp-bad-create-date]
levels = ["x4"]
expect = { "x4.xmp.create-date" = "xmp:CreateDate has month 13 (6.10.4, X4-Q7)", "x4.xmp.conforms" = "so it is not an XMP Date (6.10.1)", "x4.info.xmp-analogue-equal" = "so it cannot equal Info /CreationDate (6.10.2)" }

[x4-xmp-bad-modify-date]
