[x4-author-bag]
levels = ["x4"]
expect = { "x4.info.author-single-creator" = "with Info /Author, dc:creator is an rdf:Bag, not an rdf:Seq (6.10.2, X4-Q6)", "x4.xmp.conforms" = "and XMP defines dc:creator as an ordered array (6.10.1)" }

[x4-no-trailer-id]
