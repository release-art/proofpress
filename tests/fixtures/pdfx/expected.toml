[x4-xmp-no-trapped]
levels = ["x4"]
expect = { "x4.trapped.present" = "no pdf:Trapped, and no Info /Trapped (6.9, X4-Q1)" }

[x4-trapped-unknown]
levels = ["x4"]
expect = { "x4.trapped.true-or-false" = "pdf:Trapped and Info /Trapped are Unknown (6.9)" }

[x4-info-title-differs]
