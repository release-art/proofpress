[x4-no-xmp]
levels = ["x4"]
expect = { "x4.xmp.present" = "the catalog's /Metadata key is renamed (6.10.1)", "x4.trapped.present" = "so nothing the XMP must hold is there (6.9)", "x4.info.xmp-analogue-present" = "nor any analogue of the Info entries (6.10.2)", "x4.xmp.document-id" = "6.10.4", "x4.xmp.version-id" = "6.10.4", "x4.xmp.rendition-class" = "6.10.4", "x4.xmp.create-date" = "6.10.4", "x4.xmp.modify-date" = "6.10.4", "x4.xmp.metadata-date" = "6.10.4", "x4.xmp.title" = "6.10.4", "x4.xmp.agent-names" = "6.10.4, a warning", "x4.identity.version-present" = "6.11" }

