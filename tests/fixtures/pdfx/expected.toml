# What the PDF/X checks must report for each fixture: the set of check ids it must raise, each with a one-line reason.
# A check not listed must pass. `levels` are the PDF/X levels the fixture is verified at. Fixtures live in
# tests/fixtures/pdfs/ (built by build_pdfs.py) or here. Checked by rust/tests/completeness.rs: a check may be
# `implemented` in rust/checks.toml only when some fixture expects it and another, at one of its levels, does not.

# Genuine PDF/X-4, the base every negative is built from. pdfToolbox 17.1 "Verify compliance with PDFX-4" passes it.
[x4-good]
levels = ["x4", "print"]
expect = {}

# ---- One-defect negatives of x4-good (tests/fixtures/build_pdfs.py).
[x4-lzw]
levels = ["x4"]
expect = { "x4.filter.no-lzw" = "the page content is LZW-encoded (6.8)" }

[x4-crypt-filter]
levels = ["x4"]
expect = { "x4.filter.no-crypt" = "the page content uses the Identity Crypt filter (6.8)", "content.damaged" = "and so the page content, under Crypt, cannot be decoded and read (ISO 32000-2 7.8.2)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-filter-abbreviated]
levels = ["x4"]
expect = { "x4.filter.standard-only" = "the page content names its filter /Fl, an abbreviation only inline images may use (6.8)" }

[x4-perms]
levels = ["x4"]
expect = { "x4.perms.ur-only" = "/Perms holds /DocMDP (6.15)" }

[x4-name-not-utf8]
levels = ["x4"]
expect = { "x4.names.utf8" = "the font name /Proof#FF decodes to bytes that are not UTF-8 (6.6); twice, as BaseFont and FontName" }

[x4-name-unescaped]
levels = ["x4"]
expect = { "x4.names.hex-escaped" = "the font name holds the UTF-8 bytes of an e-acute written raw, not as #C3#A9 (6.6)" }

[x4-encrypted]
levels = ["x4"]
expect = { "x4.encrypt.absent" = "the file is encrypted with an empty password (6.15)", "file.encrypted" = "the reader refuses it, which is what makes it fail 6.15" }

[x4-too-many-objects]
levels = ["x4"]
expect = { "x4.limits.objects" = "an update lists 8,388,608 objects in use, one more than Table C.1 of PDF 1.6 allows (6.25)" }

# ---- Damage to the file's own structure: ISO 32000-2 rules every level checks (same-length edits of x4-good).
[x4-no-header]
levels = ["x4"]
expect = { "file.header" = "%PDF- is spelt %PXF-, so the file is refused (7.5.2)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-header-offset]
levels = ["x4"]
expect = { "file.header-offset" = "five bytes before %PDF-: allowed, offsets count from the header, but PDF/A forbids it (7.5.2)" }

[x4-truncated]
levels = ["x4"]
expect = { "file.startxref" = "cut in half, so no startxref (7.5.5)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-bad-xref]
levels = ["x4"]
expect = { "file.xref" = "startxref points at xreg, not a cross-reference section (7.5.4)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-no-root]
levels = ["x4"]
expect = { "file.trailer" = "the trailer's /Root is spelt /Rooo (7.5.5)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-after-eof]
levels = ["x4"]
expect = { "file.eof" = "bytes after %%EOF (7.5.5)" }

[x4-many-updates]
levels = ["x4"]
expect = { "file.limit" = "1,001 empty incremental updates, more cross-reference sections than the reader's limit", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-odd-hex]
levels = ["x4"]
expect = { "syntax.hex-digits" = "the trailer /ID's second string has 31 hex digits (7.3.4.3)" }

[x4-octal-overflow]
levels = ["x4"]
expect = { "syntax.octal-escape" = "the output condition's text starts with the escape \\777, above 255 (7.3.4.2)" }

[x4-bad-name-escape]
levels = ["x4"]
expect = { "syntax.name-escape" = "the font name /Proof#GG has an escape that is not two hex digits (7.3.5)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-duplicate-key]
levels = ["x4"]
expect = { "syntax.duplicate-key" = "the Info dictionary gives /ModDate twice (7.3.7)" }

[x4-no-eol-before-endstream]
levels = ["x4"]
expect = { "stream.eol" = "the page content's data runs straight into a space and endstream (7.3.8.1)" }

[x4-unknown-filter]
levels = ["x4"]
expect = { "stream.filter" = "a stream names the filter /FlateDecodX (7.4.1)", "x4.filter.standard-only" = "the same name is not one of PDF 1.6's filters (6.8)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

# ISO 32000-2 7.7.3.3: every page has a MediaBox.
[x4-no-media-box]
levels = ["x4"]
expect = { "page.media-box" = "the page has none, its own or inherited (7.7.3.3)", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-damaged-object]
levels = ["x4"]
expect = { "object.damaged" = "the Info dictionary starts [<, which cannot be read; every other check is then not evaluated", "x4.pdf-reference.conforms" = "the same error, as not valid PDF (6.1.1)" }

[x4-dangling-reference]
levels = ["x4"]
expect = { "object.dangling-reference" = "the trailer's /Info points at generation 5 of an object that has generation 0 (7.3.10)" }

