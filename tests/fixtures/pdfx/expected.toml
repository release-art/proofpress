[x4-author-bag]
levels = ["x4"]
expect = { "x4.info.author-single-creator" = "with Info /Author, dc:creator is an rdf:Bag, not an rdf:Seq (6.10.2, X4-Q6)", "x4.xmp.conforms" = "and XMP defines dc:creator as an ordered array (6.10.1)" }

[x4-no-trailer-id]
levels = ["x4"]
expect = { "x4.trailer.id" = "the trailer's /ID key is renamed (6.10.4)" }

[x4-xmp-bad-create-date]
levels = ["x4"]
expect = { "x4.xmp.create-date" = "xmp:CreateDate has month 13 (6.10.4, X4-Q7)", "x4.xmp.conforms" = "so it is not an XMP Date (6.10.1)", "x4.info.xmp-analogue-equal" = "so it cannot equal Info /CreationDate (6.10.2)" }

[x4-xmp-bad-modify-date]
