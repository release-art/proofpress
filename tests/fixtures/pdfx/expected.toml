# What the PDF/X checks must report for each fixture: the set of check ids it must raise, each with a one-line reason.
# A check not listed must pass. `levels` are the PDF/X levels the fixture is verified at. Fixtures live in
# tests/fixtures/pdfs/ (built by build_pdfs.py) or here. Checked by rust/tests/completeness.rs: a check may be
# `implemented` in rust/checks.toml only when some fixture expects it and another, at one of its levels, does not.

# Genuine PDF/X-4, the base every negative is built from. pdfToolbox 17.1 "Verify compliance with PDFX-4" passes it.
[x4-good]
levels = ["x4"]
expect = {}

# ---- One-defect negatives of x4-good (tests/fixtures/build_pdfs.py).
[x4-lzw]
levels = ["x4"]
expect = { "x4.filter.no-lzw" = "the page content is LZW-encoded (6.8)" }

[x4-crypt-filter]
levels = ["x4"]
expect = { "x4.filter.no-crypt" = "the page content uses the Identity Crypt filter (6.8)" }

[x4-filter-abbreviated]
levels = ["x4"]
expect = { "x4.filter.standard-only" = "the page content names its filter /Fl, an abbreviation only inline images may use (6.8)" }

[x4-perms]
levels = ["x4"]
expect = { "x4.perms.ur-only" = "/Perms holds /DocMDP (6.15)" }

[x4-name-not-utf8]
levels = ["x4"]
expect = { "x4.names.utf8" = "the font name /Proof#FF decodes to bytes that are not UTF-8 (6.6); twice, as BaseFont and FontName" }

[x4-name-unescaped]
levels = ["x4"]
expect = { "x4.names.hex-escaped" = "the font name holds the UTF-8 bytes of an e-acute written raw, not as #C3#A9 (6.6)" }

[x4-encrypted]
levels = ["x4"]
expect = { "x4.encrypt.absent" = "the file is encrypted with an empty password (6.15)", "file.encrypted" = "the reader refuses it, which is what makes it fail 6.15" }

[x4-too-many-objects]
levels = ["x4"]
expect = { "x4.limits.objects" = "an update lists 8,388,608 objects in use, one more than Table C.1 of PDF 1.6 allows (6.25)" }

# ---- Damage to the file's own structure: ISO 32000-2 rules every level checks (same-length edits of x4-good).
[x4-no-header]
levels = ["x4"]
expect = { "file.header" = "%PDF- is spelt %PXF-, so the file is refused (7.5.2)" }

[x4-header-offset]
levels = ["x4"]
expect = { "file.header-offset" = "five bytes before %PDF-: allowed, offsets count from the header, but PDF/A forbids it (7.5.2)" }

[x4-truncated]
levels = ["x4"]
expect = { "file.startxref" = "cut in half, so no startxref (7.5.5)" }

[x4-bad-xref]
levels = ["x4"]
expect = { "file.xref" = "startxref points at xreg, not a cross-reference section (7.5.4)" }

[x4-no-root]
levels = ["x4"]
expect = { "file.trailer" = "the trailer's /Root is spelt /Rooo (7.5.5)" }

[x4-after-eof]
levels = ["x4"]
expect = { "file.eof" = "bytes after %%EOF (7.5.5)" }

[x4-many-updates]
levels = ["x4"]
expect = { "file.limit" = "1,001 empty incremental updates, more cross-reference sections than the reader's limit" }

[x4-odd-hex]
levels = ["x4"]
expect = { "syntax.hex-digits" = "the trailer /ID's second string has 31 hex digits (7.3.4.3)" }

[x4-octal-overflow]
levels = ["x4"]
expect = { "syntax.octal-escape" = "the output condition's text starts with the escape \\777, above 255 (7.3.4.2)" }

[x4-bad-name-escape]
levels = ["x4"]
expect = { "syntax.name-escape" = "the font name /Proof#GG has an escape that is not two hex digits (7.3.5)" }

[x4-duplicate-key]
levels = ["x4"]
expect = { "syntax.duplicate-key" = "the Info dictionary gives /ModDate twice (7.3.7)" }

[x4-no-eol-before-endstream]
levels = ["x4"]
expect = { "stream.eol" = "the page content's data runs straight into a space and endstream (7.3.8.1)" }

[x4-unknown-filter]
levels = ["x4"]
expect = { "stream.filter" = "a stream names the filter /FlateDecodX (7.4.1)", "x4.filter.standard-only" = "the same name is not one of PDF 1.6's filters (6.8)" }

[x4-damaged-object]
levels = ["x4"]
expect = { "object.damaged" = "the Info dictionary starts [<, which cannot be read; every other check is then not evaluated" }

[x4-dangling-reference]
levels = ["x4"]
expect = { "object.dangling-reference" = "the trailer's /Info points at generation 5 of an object that has generation 0 (7.3.10)" }

# PDF/X-4 6.9 to 6.11: trapping, metadata, identification. Each changes x4-good's XMP or Info in one way.

[x4-xmp-filtered]
levels = ["x4"]
expect = { "x4.xmp.unfiltered" = "the document's metadata stream is Flate-compressed (6.10.1)" }

[x4-page-xmp-filtered]
levels = ["x4"]
expect = { "x4.xmp.unfiltered" = "the page's metadata stream is Flate-compressed (6.10.1, X4-Q8)" }

[x4-page-xmp-malformed]
levels = ["x4"]
expect = { "x4.xmp.well-formed" = "the page's XMP lacks a closing rdf:Description tag (6.10.6)" }

[x4-page-xmp-header-bytes]
levels = ["x4"]
expect = { "x4.xmp.no-bytes-encoding-attrs" = "the page's packet header has a bytes attribute (6.10.3)" }

[x4-xmp-prefix]
levels = ["x4"]
expect = { "x4.xmp.namespace-prefixes" = "the pdfxid namespace is written with the prefix gts (6.10.1, Table 2)" }

[x4-xmp-no-document-id]
levels = ["x4"]
expect = { "x4.xmp.document-id" = "no xmpMM:DocumentID (6.10.4)" }

[x4-xmp-document-id-not-uuid]
levels = ["x4"]
expect = { "x4.xmp.document-id-uuid" = "the document ID is an xmp.did: URI, a warning (6.10.4)" }

[x4-xmp-no-version-id]
levels = ["x4"]
expect = { "x4.xmp.version-id" = "no xmpMM:VersionID (6.10.4)" }

[x4-xmp-no-rendition-class]
levels = ["x4"]
expect = { "x4.xmp.rendition-class" = "no xmpMM:RenditionClass (6.10.4)" }

[x4-xmp-no-metadata-date]
levels = ["x4"]
expect = { "x4.xmp.metadata-date" = "no xmp:MetadataDate (6.10.4)" }

[x4-xmp-no-title]
levels = ["x4"]
expect = { "x4.xmp.title" = "no dc:title, and no Info /Title (6.10.4)" }

[x4-xmp-no-creator-tool]
levels = ["x4"]
expect = { "x4.xmp.agent-names" = "no xmp:CreatorTool and no Info /Creator, a warning (6.10.4)" }

[x4-xmp-no-version]
levels = ["x4"]
expect = { "x4.identity.version-present" = "no pdfxid:GTS_PDFXVersion, and none in Info (6.11)" }

[x4-xmp-wrong-version]
levels = ["x4"]
expect = { "x4.identity.version-value" = "pdfxid:GTS_PDFXVersion is PDF/X-3, as is Info's (6.11)" }

[x4-xmp-pdfxid-extra]
levels = ["x4"]
expect = { "x4.identity.pdfxid-only-version" = "pdfxid:GTS_PDFXConformance beside the version (6.11)" }

[x4-info-conformance]
levels = ["x4"]
expect = { "x4.identity.no-info-conformance" = "Info has /GTS_PDFXConformance (6.11)" }

[x4-info-version-utf16]
levels = ["x4"]
expect = { "x4.info.pdfx-version-pdfdoc" = "Info /GTS_PDFXVersion is UTF-16; its text still equals XMP's (6.10.2)" }

[x4-xmp-no-trapped]
levels = ["x4"]
expect = { "x4.trapped.present" = "no pdf:Trapped, and no Info /Trapped (6.9, X4-Q1)" }

[x4-trapped-unknown]
levels = ["x4"]
expect = { "x4.trapped.true-or-false" = "pdf:Trapped and Info /Trapped are Unknown (6.9)" }

[x4-info-title-differs]
levels = ["x4"]
expect = { "x4.info.xmp-analogue-equal" = "Info /Title differs from dc:title (6.10.2)" }

[x4-info-no-analogue]
levels = ["x4"]
expect = { "x4.info.xmp-analogue-present" = "Info /Subject has no dc:description (6.10.2)" }

[x4-author-bag]
levels = ["x4"]
expect = { "x4.info.author-single-creator" = "with Info /Author, dc:creator is an rdf:Bag, not an rdf:Seq (6.10.2, X4-Q6)", "x4.xmp.conforms" = "and XMP defines dc:creator as an ordered array (6.10.1)" }

[x4-no-trailer-id]
levels = ["x4"]
expect = { "x4.trailer.id" = "the trailer's /ID key is renamed (6.10.4)" }

[x4-xmp-bad-create-date]
levels = ["x4"]
expect = { "x4.xmp.create-date" = "xmp:CreateDate has month 13 (6.10.4, X4-Q7)", "x4.xmp.conforms" = "so it is not an XMP Date (6.10.1)", "x4.info.xmp-analogue-equal" = "so it cannot equal Info /CreationDate (6.10.2)" }

[x4-xmp-bad-modify-date]
levels = ["x4"]
expect = { "x4.xmp.modify-date" = "xmp:ModifyDate has hour 25 (6.10.4, X4-Q7)", "x4.xmp.conforms" = "so it is not an XMP Date (6.10.1)", "x4.info.xmp-analogue-equal" = "so it cannot equal Info /ModDate (6.10.2)" }

[x4-no-xmp]
levels = ["x4"]
expect = { "x4.xmp.present" = "the catalog's /Metadata key is renamed (6.10.1)", "x4.trapped.present" = "so nothing the XMP must hold is there (6.9)", "x4.info.xmp-analogue-present" = "nor any analogue of the Info entries (6.10.2)", "x4.xmp.document-id" = "6.10.4", "x4.xmp.version-id" = "6.10.4", "x4.xmp.rendition-class" = "6.10.4", "x4.xmp.create-date" = "6.10.4", "x4.xmp.modify-date" = "6.10.4", "x4.xmp.metadata-date" = "6.10.4", "x4.xmp.title" = "6.10.4", "x4.xmp.agent-names" = "6.10.4, a warning", "x4.identity.version-present" = "6.11" }

# PDF/X-4 6.4.1 and 6.4.2.1: the output intent. Each changes x4-good's intent or its profile's header in one way.

[x4-no-output-intent]
levels = ["x4"]
expect = { "x4.output-intent.present" = "the catalog has no /OutputIntents (6.4.2.1)" }

[x4-intent-not-pdfx]
levels = ["x4"]
expect = { "x4.output-intent.present" = "the only output intent is /GTS_PDFA1 (6.4.2.1)" }

[x4-two-pdfx-intents]
levels = ["x4"]
expect = { "x4.output-intent.unique" = "two /GTS_PDFX output intents (6.4.2.1)" }

[x4-intent-no-identifier]
levels = ["x4"]
expect = { "x4.output-intent.identifier-present" = "no /OutputConditionIdentifier (6.4.2.1)" }

[x4-intent-identifier-not-text]
levels = ["x4"]
expect = { "x4.output-intent.identifier-text-string" = "/OutputConditionIdentifier is a name, not a text string (6.4.2.1)" }

[x4-intent-registry-not-url]
levels = ["x4"]
expect = { "x4.output-intent.registry-name-url" = "/RegistryName is not a URL, a warning (6.4.2.1)" }

[x4-intent-no-profile]
levels = ["x4"]
expect = { "x4.output-intent.dest-profile-present" = "no /DestOutputProfile (6.4.2.1)" }

[x4-intent-profile-ref]
levels = ["x4"]
expect = { "x4.output-intent.no-dest-profile-ref" = "a /DestOutputProfileRef, which only X-4p may use (6.4.2.1)" }

[x4-intent-no-condition]
levels = ["x4"]
expect = { "x4.output-intent.output-condition" = "no /OutputCondition, a warning (6.4.2.1)" }

[x4-intent-profile-v5]
levels = ["x4"]
expect = { "x4.output-intent.profile-version" = "the profile's version byte says 5 (6.4.2.1)" }

[x4-intent-profile-monitor]
levels = ["x4"]
expect = { "x4.output-intent.profile-class-prtr" = "the profile's class is mntr (6.4.2.1)" }

[x4-intent-profile-lab]
levels = ["x4"]
expect = { "x4.output-intent.channels" = "the profile's data colour space is Lab (6.4.1)" }

# PDF/X-4 6.12: page boxes. Each changes x4-good's page boxes in one way.

[x4-no-trim-or-art]
levels = ["x4"]
expect = { "x4.boxes.trim-or-art" = "the page has neither a TrimBox nor an ArtBox (6.12)" }

[x4-trim-and-art]
levels = ["x4"]
expect = { "x4.boxes.not-both" = "the page has both (6.12)" }

[x4-art-not-trim]
levels = ["x4"]
expect = { "x4.boxes.prefer-trim" = "an ArtBox instead of a TrimBox, a warning (6.12)" }

[x4-trim-beyond-bleed]
levels = ["x4"]
expect = { "x4.boxes.within-bleed" = "the BleedBox is smaller than the TrimBox (6.12)" }

[x4-bleed-beyond-crop]
levels = ["x4"]
expect = { "x4.boxes.within-crop" = "a CropBox inside the BleedBox (6.12)" }

[x4-crop-beyond-media]
levels = ["x4"]
expect = { "x4.boxes.within-media" = "a CropBox larger than the MediaBox (6.12)" }

# PDF/X-4 6.7 to 6.26: keys forbidden anywhere in the file (X4-Q3). Each adds one thing to x4-good.

[x4-xobject-opi]
levels = ["x4"]
expect = { "x4.xobject.no-opi" = "a form XObject with /OPI (6.7)" }

[x4-form-ref]
levels = ["x4"]
expect = { "x4.xobject.no-ref" = "a form XObject with /Ref (6.7)" }

[x4-stream-external]
levels = ["x4"]
expect = { "x4.stream.no-external-f" = "a stream with /F (6.7)" }

[x4-filespec-not-embedded]
levels = ["x4"]
expect = { "x4.filespec.embedded" = "a file specification in /AF without /EF (6.7)" }

[x4-gstate-tr]
levels = ["x4"]
expect = { "x4.extgstate.no-tr" = "an ExtGState with /TR (6.13)" }

[x4-gstate-htp]
levels = ["x4"]
expect = { "x4.extgstate.no-htp" = "an ExtGState with /HTP (6.13)" }

[x4-gstate-tr2]
levels = ["x4"]
expect = { "x4.extgstate.tr2-default" = "an ExtGState with /TR2 /Identity (6.13)" }

[x4-halftone-type]
levels = ["x4"]
expect = { "x4.halftone.type-1-or-5" = "a type 6 halftone (6.13)" }

[x4-halftone-name]
levels = ["x4"]
expect = { "x4.halftone.no-name" = "a halftone with /HalftoneName (6.13)" }

[x4-halftone-transfer]
levels = ["x4"]
expect = { "x4.halftone.transfer-function" = "a type 1 halftone with /TransferFunction (6.13, X4-Q9)" }

[x4-postscript-xobject]
levels = ["x4"]
expect = { "x4.xobject.no-postscript" = "a PostScript XObject (6.14)" }

[x4-form-subtype2-ps]
levels = ["x4"]
expect = { "x4.xobject.no-subtype2-ps" = "a form XObject with /Subtype2 /PS (6.14)" }

[x4-image-alternate-printed]
levels = ["x4"]
expect = { "x4.image.no-default-for-printing" = "an image alternate with /DefaultForPrinting true (6.16)" }

[x4-open-action]
levels = ["x4"]
expect = { "x4.actions.absent" = "a URI action as /OpenAction (6.18, X4-Q11)" }

[x4-javascript]
levels = ["x4"]
expect = { "x4.javascript.absent" = "a /JavaScript name tree (6.18)" }

[x4-viewer-print-area]
levels = ["x4"]
expect = { "x4.viewer-prefs.areas" = "ViewerPreferences /PrintArea /CropBox (6.21)" }

[x4-alternate-presentations]
levels = ["x4"]
expect = { "x4.names.no-alternate-presentations" = "/AlternatePresentations in the name dictionary (6.22)" }

[x4-pres-steps]
levels = ["x4"]
expect = { "x4.page.no-pres-steps" = "a page with /PresSteps (6.22)" }

[x4-xfa]
levels = ["x4"]
expect = { "x4.acroform.no-xfa" = "an interactive form with /XFA (6.26)" }

# PDF/X-4 6.24, optional content.

[x4-oc-unnamed]
levels = ["x4"]
expect = { "x4.oc.config-name-present" = "the default configuration has no /Name (6.24)" }

[x4-oc-same-name]
levels = ["x4"]
expect = { "x4.oc.config-name-unique" = "two configurations are named Print (6.24)" }

[x4-oc-order-incomplete]
levels = ["x4"]
expect = { "x4.oc.order-complete" = "/Order lists one of two groups (6.24, X4-Q13)" }

[x4-oc-as]
levels = ["x4"]
expect = { "x4.oc.no-as" = "the default configuration has /AS (6.24)" }

# PDF/X-4 6.17 and 6.9, annotations and trap networks.

[x4-annot-inside-bleed]
levels = ["x4"]
expect = { "x4.annot.outside-bleed" = "a Text annotation inside the bleed box (6.17)" }

[x4-printermark-inside-trim]
levels = ["x4"]
expect = { "x4.annot.printermark-outside-trim" = "a PrinterMark annotation inside the trim box (6.17)" }

[x4-trapnet-untrapped]
levels = ["x4"]
expect = { "x4.trapped.trapnet-implies-true" = "a TrapNet annotation while pdf:Trapped is False (6.9)" }

[x4-trapnet-font-fauxing]
levels = ["x4"]
expect = { "x4.trapnet.font-fauxing-empty" = "a TrapNet annotation with /FontFauxing (6.9)" }

[x4-trapnet-pcm-rgb]
levels = ["x4"]
expect = { "x4.trapnet.pcm-matches-intent" = "a TrapNet appearance with /PCM /DeviceRGB under a CMYK intent (6.9)" }

# PDF/X-4 6.10.1 and 6.10.2: XMP value types and unlisted Info entries.

[x4-xmp-wrong-type]
levels = ["x4"]
expect = { "x4.xmp.conforms" = "dc:subject is plain text, not an rdf:Bag (6.10.1)" }

[x4-info-in-pdf-schema]
levels = ["x4"]
expect = { "x4.info.unlisted-not-in-predefined-schema" = "Info /Company is written as pdf:Company (6.10.2)" }
