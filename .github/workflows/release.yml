name: Release

# Push a tag v1.2.3: tests, then PyPI (via TestPyPI first), then a GitHub Release.
# The tag is the version (pdm-backend scm). The same tag also triggers the Docker publish in image.yml.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing + Sigstore
      contents: write # the GitHub Release
    steps:
      - uses: actions/checkout@v6
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
      - name: Build packages
        # Pin the version from the tag so a dirty tree can't add a local segment PyPI rejects.
        run: |
          export PDM_BUILD_SCM_VERSION="${GITHUB_REF_NAME#v}"
          pdm build
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.1
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
      - name: Move Sigstore bundles out of dist/
        # twine check dist/* rejects *.sigstore.json.
        run: |
          mkdir -p signatures
          mv dist/*.sigstore.json signatures/
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false # the PyPI step below makes the real ones
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Extract release notes from CHANGELOG
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.ref_name }} # v1.2.3 -> "## [1.2.3]"
          path: ./CHANGELOG.md
        continue-on-error: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes || format('Release {0}. See [CHANGELOG.md](CHANGELOG.md).', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'dev') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            signatures/*.sigstore.json
          fail_on_unmatched_files: true
