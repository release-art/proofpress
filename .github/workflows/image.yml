name: Image

# PRs: build both images for the runner's arch and smoke them (no push).
# Weekly (Mon 04:00 UTC) and manual runs: smoke, then push amd64+arm64 as :latest and :tl2025.
# A v* tag: smoke, then push the same images as :<version>, :latest and :tl2025.
#   So :latest is always the most recent build, weekly or release.
on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - bin/docker/**
      - pyproject.toml
      - pdm.lock
      - src/**
      - .github/workflows/image.yml
  schedule:
    - cron: "0 4 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TL_TAG: tl2025 # keep in step with TL_REPO in the Dockerfile

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags, for bin/docker/version.sh
      - uses: docker/setup-buildx-action@v3
      - run: bin/docker/build.sh # logs the base-image digests first
      - run: bin/docker/smoke.sh
      - run: bin/docker/test.sh # the whole suite in the image, with real veraPDF and Ghostscript

  # One native build per target x arch (no qemu), pushed by digest; `merge` stitches the manifest lists.
  build:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [lualatex, full]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bin/docker/version.sh >> "$GITHUB_ENV" # PKG_VERSION, REVISION
      - run: bin/docker/base-digests.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: releaseart/${{ matrix.target }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=releaseart/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.PKG_VERSION }}
            REVISION=${{ env.REVISION }}
            PKG_VERSION=${{ env.PKG_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lualatex, full]
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: releaseart/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}},enable=${{ env.IS_TAG }}
            type=raw,value=latest
            type=raw,value=${{ env.TL_TAG }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: >
          docker buildx imagetools create
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          $(printf 'releaseart/${{ matrix.target }}@sha256:%s ' *)
      - name: Sync the Docker Hub description
        # Needs a token with write access to the repo's metadata; if this 403s, raise the token to Read/Write/Delete.
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: releaseart/${{ matrix.target }}
          short-description: "${{ matrix.target == 'full' && 'lualatex + Ghostscript + veraPDF + proof-pdf: check print PDFs against PDF/X-4 and PDF/A' || 'TeX Live 2025 with LuaLaTeX on Debian, multi-arch, no Java or Python' }}"
          readme-filepath: docker/hub-${{ matrix.target }}.md
