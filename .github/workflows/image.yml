name: Image

# PRs: build the images for the runner's arch and smoke them (no push).
# Weekly (Mon 04:00 UTC) and manual runs: smoke, then push amd64+arm64 as :latest and :tl2025.
# A v* tag: smoke, then push the same images as :<version>, :latest and :tl2025.
#   So :latest is always the most recent build, weekly or release.
on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - bin/docker/**
      - pyproject.toml
      - pdm.lock
      - src/**
      - .github/workflows/image.yml
  schedule:
    - cron: "0 4 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TL_TAG: tl2025 # keep in step with TL_REPO in the Dockerfile

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags, for bin/docker/version.sh
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4 # exposes the Actions cache token to the scripts below
      - run: bin/docker/build.sh # logs the base-image digests first
      - run: bin/docker/smoke.sh
      - run: bin/docker/test.sh # the whole suite in the image, with real veraPDF and Ghostscript

  # One native job per arch (no qemu). It builds lualatex, lualatex-python, then full in turn on the same builder, so the
  # slow TeX Live stage is built once and reused; each image is pushed by digest and `merge` stitches the manifest lists.
  build:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bin/docker/version.sh >> "$GITHUB_ENV" # PKG_VERSION, REVISION
      - run: bin/docker/base-digests.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: lualatex
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lualatex
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=releaseart/lualatex,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.PKG_VERSION }}
            REVISION=${{ env.REVISION }}
            PKG_VERSION=${{ env.PKG_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - id: lualatex-python
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lualatex-python
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=releaseart/lualatex-python,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.PKG_VERSION }}
            REVISION=${{ env.REVISION }}
            PKG_VERSION=${{ env.PKG_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - id: full
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=releaseart/full,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.PKG_VERSION }}
            REVISION=${{ env.REVISION }}
            PKG_VERSION=${{ env.PKG_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/lualatex-${LUALATEX#sha256:}" \
                "/tmp/digests/lualatex-python-${PYTHON#sha256:}" \
                "/tmp/digests/full-${FULL#sha256:}"
        env:
          LUALATEX: ${{ steps.lualatex.outputs.digest }}
          PYTHON: ${{ steps.lualatex-python.outputs.digest }}
          FULL: ${{ steps.full.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lualatex, lualatex-python, full]
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: releaseart/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}},enable=${{ env.IS_TAG }}
            type=raw,value=latest
            type=raw,value=${{ env.TL_TAG }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: >
          docker buildx imagetools create
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          $(for h in $(ls | sed -n 's/^${{ matrix.target }}-\([0-9a-f]\{64\}\)$/\1/p'); do echo releaseart/${{ matrix.target }}@sha256:$h; done)
      - name: Sync the Docker Hub description
        # Needs a token with write access to the repo's metadata; if this 403s, raise the token to Read/Write/Delete.
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: releaseart/${{ matrix.target }}
          short-description: "${{ matrix.target == 'full' && 'lualatex + Ghostscript + veraPDF + proof-pdf: check print PDFs against PDF/X-4 and PDF/A' || matrix.target == 'lualatex-python' && 'Python + LuaLaTeX + Ghostscript + veraPDF: everything proof-pdf needs, a base to pip install it on' || 'TeX Live 2025 with LuaLaTeX on Debian, multi-arch, no Java or Python' }}"
          readme-filepath: docker/hub-${{ matrix.target }}.md
