name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PDM_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: python -m pip install pdm
      - run: pdm install --with dev
      - run: pdm run ruff check src tests
      - run: pdm run ruff format --check src tests
      - run: pdm run pyright
      - run: pdm run pytest
