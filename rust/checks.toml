# Every check proof-pdf knows, as data. build.rs reads it to generate the check table (src/checks.rs) and
# rust/CHECKS.md. Fields: id (stable, never reused), aliases (old ids), title (our words), clauses (`<standard>:<clause>`,
# validated against rust/clauses/), severity (error or warning), applies (x4, x4p, x5g, x5pg, x5n, or print for house
# checks), status (implemented, todo, or skip with a reason). Parameters arrive with the checks that take them.
# PDF/X rows come from the requirement registers in proof-pdf-test-db/docs/pdfx/, by id and clause number only.

